version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      # Conventional Commits, so release-please treats dependency bumps as
      # patch-level fixes rather than ignoring them.
      prefix: fix
      prefix-development: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
