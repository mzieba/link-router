      #     mv signed/link-router-windows-amd64.exe dist/
      #     (cd dist && sha256sum link-router-* > SHA256SUMS)
      #     gh release upload ${{ steps.release.outputs.tag_name }} \
      #       dist/link-router-windows-amd64.exe \
      #       dist/SHA256SUMS \
